name: Build and Release custody-blockscout-frontend

env:
  NAME: 'custody-blockscout-frontend'
  ACR_NAME: solidstate
  AZURE_CLIENT_ID: '8e619a41-08e8-46d0-b38d-dd4185432cac'
  AZURE_TENANT_ID: 'ea2aa545-c271-48b3-880d-0b56c78e4d9c'
  AZURE_SUBSCRIPTION_ID: 'a5d084b6-9c2f-4792-997b-3b17c7854ab2'

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  BuildAndPush:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get all tags
        run: git fetch --tags --force

      - name: Get next version
        id: version
        run: echo "VERSION=$(.github/scripts/nextversion.sh)" >> $GITHUB_OUTPUT

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/$NAME:${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/$NAME:latest \
            -t $ACR_NAME.azurecr.io/$NAME:${{ steps.version.outputs.VERSION }} \
            --build-arg GIT_COMMIT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8) \
            --build-arg GIT_TAG=${{ steps.version.outputs.VERSION }} \
            -f Dockerfile .
          docker push $ACR_NAME.azurecr.io/$NAME --all-tags

  Release:
    needs: [BuildAndPush]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create git tag
        run: |
          git tag ${{ needs.BuildAndPush.outputs.version }}
          git push origin ${{ needs.BuildAndPush.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.BuildAndPush.outputs.version }}
